# Xcode project recipe. On the Mac: `brew install xcodegen` once, then `xcodegen` in this folder
# creates ShootDesk.xcodeproj. Re-run it whenever files are added.
name: ShootDesk
options:
  bundleIdPrefix: com.horizonhomemedia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Shared by the app and the widget. Put your Apple Developer Team ID here (Xcode → Settings → Accounts,
# or the 10-character code on developer.apple.com → Membership) so re-running xcodegen keeps it.
settings:
  base:
    DEVELOPMENT_TEAM: ""

# The one outside package (see CLAUDE.md): WhisperKit, for press-and-hold voice in Ask.
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

targets:
  ShootDesk:
    type: application
    platform: iOS
    sources:
      - path: ShootDesk
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: ShootDeskWidget   # the Home Screen widget, built and embedded with the app
      - package: WhisperKit
        product: WhisperKit
    info:
      path: ShootDesk/Info.plist
      properties:
        CFBundleDisplayName: ShootDesk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Saves listing photos from Aryeo to your Photos library.
        NSMicrophoneUsageDescription: Hold the mic button in Ask to speak a question. Your voice is turned into text on the phone and never leaves it.
        NSLocationWhenInUseUsageDescription: Works out the drive to your next shoot so ShootDesk can tell you when to leave.
        NSSupportsLiveActivities: true
        # Background refresh: iOS wakes the app between uses to pull the newest orders.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.horizonhomemedia.shootdesk.refresh
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # Lets a Home Screen widget tap open a specific shoot (shootdesk://shoot/<order id>).
        CFBundleURLTypes:
          - CFBundleURLName: com.horizonhomemedia.shootdesk
            CFBundleURLSchemes:
              - shootdesk
    # The app and widget share one keychain group so the widget can read the Aryeo key.
    entitlements:
      path: ShootDesk/ShootDesk.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.horizonhomemedia.shootdesk"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizonhomemedia.shootdesk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  ShootDeskWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ShootDeskWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      # Shares the app's data code and keychain helper.
      - path: ShootDesk/Core
      - path: ShootDesk/Shared
    info:
      path: ShootDeskWidget/Info.plist
      properties:
        CFBundleDisplayName: ShootDesk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ShootDeskWidget/ShootDeskWidget.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.horizonhomemedia.shootdesk"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizonhomemedia.shootdesk.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
